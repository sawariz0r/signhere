services:
  signhere:
    build: .
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:3000"
    environment:
      BASE_URL: ${BASE_URL:-http://localhost:3000}
      DATA_DIR: /data
      SIGNHERE_KEYS_DIR: /keys
      SIGNHERE_SEAL_PYTHON: /opt/signhere-seal/bin/python
      SIGNHERE_SIGNING_LINK_TTL_DAYS: ${SIGNHERE_SIGNING_LINK_TTL_DAYS:-7}
      NODE_ENV: production
      TRUST_PROXY: ${TRUST_PROXY:-uniquelocal}
      # Optional e-mail. SMTP is the default provider; leave SMTP_HOST and SMTP_URL empty to disable.
      SIGNHERE_MAIL_PROVIDER: ${SIGNHERE_MAIL_PROVIDER:-smtp}
      SIGNHERE_MAIL_FROM: ${SIGNHERE_MAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      # Shorthand accepted for SMTP_HOST/PORT/USER/PASSWORD and SIGNHERE_MAIL_FROM.
      SMTP_URL: ${SMTP_URL:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Optional independent approval through a central service (e.g. https://signhere.prpl.se).
      # Leave SIGNHERE_CENTRAL_URL empty (the default) and nothing is ever sent to a central service.
      SIGNHERE_CENTRAL_URL: ${SIGNHERE_CENTRAL_URL:-}
      SIGNHERE_CENTRAL_TRUST_ROOT: ${SIGNHERE_CENTRAL_TRUST_ROOT:-}
      SIGNHERE_CENTRAL_API_KEY: ${SIGNHERE_CENTRAL_API_KEY:-}
      DATABASE_URL: postgresql://signhere:${APP_DATABASE_PASSWORD:?}@postgres:5432/signhere
      MIGRATION_DATABASE_URL: postgresql://signhere_migrator:${POSTGRES_PASSWORD:?}@postgres:5432/signhere
    volumes:
      - signhere-data:/data
      - signhere-keys:/keys
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 128
    depends_on:
      postgres:
        condition: service_healthy
      postgres-upgrade:
        condition: service_completed_successfully

  postgres:
    # postgres:17-bookworm with the role scripts built in (deploy/postgres/Dockerfile).
    build: ./deploy/postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: signhere
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  # One-shot: upgrades databases created before separate roles, then exits. It changes
  # nothing on current installations. The application starts only after it succeeds.
  postgres-upgrade:
    build: ./deploy/postgres
    restart: "no"
    entrypoint: ["sh", "/usr/local/share/signhere/upgrade-legacy-roles.sh", "--confirm"]
    environment:
      PGHOST: postgres
      POSTGRES_DB: signhere
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      SIGNHERE_UPGRADE_BACKUP_DIR: /backups
    volumes:
      - postgres-upgrade-backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

volumes:
  signhere-data:
  signhere-keys:
  postgres-data:
  postgres-upgrade-backups:
