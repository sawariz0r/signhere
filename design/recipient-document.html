<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mottagarens dokument · prototyp · signhere</title>
<!--
  Signhere recipient document: one document-first view for review, signing and the signed receipt.
  Standalone prototype. Tokens and class names mirror web/editor/editor.css (.ed-*) and web/styles.css
  (sign-*, signature-modal). Everything new is prefixed rd-. See design/recipient-document.md.
-->
<style>
@font-face{font-family:'Schibsted Grotesk';font-weight:400 900;font-style:normal;font-display:swap;src:url(../node_modules/@fontsource-variable/schibsted-grotesk/files/schibsted-grotesk-latin-wght-normal.woff2) format('woff2-variations'),url(../node_modules/@fontsource-variable/schibsted-grotesk/files/schibsted-grotesk-latin-wght-normal.woff2) format('woff2')}
@font-face{font-family:'Schibsted Grotesk';font-weight:400 900;font-style:normal;font-display:swap;unicode-range:U+0100-02AF,U+1E00-1EFF;src:url(../node_modules/@fontsource-variable/schibsted-grotesk/files/schibsted-grotesk-latin-ext-wght-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-weight:400;src:url(../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-weight:500;src:url(../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-500-normal.woff2) format('woff2')}
/* The PDF export (web/editor/pdf-export.ts) embeds only Noto Sans Regular and fakes bold. */
@font-face{font-family:'Signhere PDF';font-weight:400;src:url(../server/assets/NotoSans-Regular.ttf) format('truetype'),local('Noto Sans'),local('NotoSans-Regular')}

/* ---------- Tokens: copied from .ed in web/editor/editor.css ---------- */
:root{
  --ink:#0e1116;--ink-hover:#2a3039;--text:#2a3039;--secondary:#3a4049;--muted:#5b626d;--subtle:#6b727d;--faint:#9aa1ab;
  --line:#e3e6ea;--input:#d9dde2;--dash:#c4cad1;--inner:#eef0f2;--track:#e9ecef;--page:#f6f7f9;--hover:#f1f3f5;
  --green:oklch(0.56 0.13 155);--amber:oklch(0.72 0.15 70);--red:oklch(0.52 0.18 25);
  --ui:'Schibsted Grotesk',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;--ease:cubic-bezier(.2,.7,.2,1);
  --accent:var(--ink);
}
*{box-sizing:border-box}
html,body{margin:0}
body{min-width:320px;background:var(--page);color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased;font-synthesis:weight}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.55}
button:focus-visible,a:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
h1,h2,h3,p{margin:0}
.ed-mono{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.visually-hidden{position:absolute;width:1px;height:1px;padding:0;border:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
@keyframes shIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes shFade{from{opacity:0}to{opacity:1}}
@keyframes shRise{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
@keyframes shSheet{from{transform:translateY(100%)}to{transform:none}}

/* ---------- Prototype controls (not product UI) ---------- */
.proto{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:8px 16px;background:#fff;border-bottom:1px dashed var(--dash);font-size:12px;color:var(--muted)}
.proto strong{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.proto label{display:flex;align-items:center;gap:6px}
.proto select{height:28px;border:1px solid var(--input);border-radius:7px;background:#fff;padding:0 6px;font-size:12px;font-weight:600}
.proto button{height:28px;border:0;background:none;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:12px}

/* ---------- Editor primitives reused as-is ---------- */
.ed-btn{height:36px;padding:0 12px;border:1px solid var(--input);border-radius:8px;background:#fff;color:var(--ink);font-size:13px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;text-decoration:none}
.ed-btn:hover:not(:disabled){background:var(--hover)}
.ed-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;padding:0 14px}
.ed-btn.primary:hover:not(:disabled){background:var(--ink-hover);border-color:var(--ink-hover)}
.ed-btn.large{height:38px;padding:0 14px;border-radius:9px;font-size:14px}
.ed-btn.xl{height:48px;padding:0 24px;border-radius:12px;font-size:16px;font-weight:700}
.ed-btn.block{width:100%}
.ed-btn svg{flex-shrink:0}
.ed-count{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:rgba(255,255,255,.18);font-size:12px;display:grid;place-items:center}
.ed-btn:not(.primary) .ed-count{background:var(--inner)}
.ed-text-btn{height:28px;padding:0 8px;border:0;border-radius:6px;background:none;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.ed-text-btn:hover:not(:disabled){background:var(--hover);color:var(--ink)}

.ed-topbar{position:sticky;top:0;z-index:20;background:rgba(246,247,249,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.ed-topbar-inner{max-width:1240px;margin:0 auto;padding:0 24px;height:60px;display:flex;align-items:center;gap:14px}
.ed-logo{width:34px;height:34px;border:0;border-radius:9px;background:none;display:grid;place-items:center;flex-shrink:0;padding:0}
.ed-logo:hover{background:#eceef1}
.ed-logo span{width:22px;height:22px;border-radius:6px;background:var(--ink);display:grid;place-items:center}
.ed-logo i{width:8px;height:8px;border-radius:50%;background:#fff}
.ed-slash{color:var(--dash);font-size:18px;flex-shrink:0}
.ed-title{min-width:0;flex:0 1 360px;height:36px;padding:0 8px;margin-left:-8px;border:0;border-radius:8px;background:none;font-size:15px;font-weight:600;outline:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center}
input.ed-title:hover{background:#eceef1}
input.ed-title:focus{background:#fff;box-shadow:0 0 0 1px var(--input)}
.ed-save{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--subtle);white-space:nowrap}
.ed-save svg{color:var(--green)}
.ed-topbar-actions{margin-left:auto;display:flex;align-items:center;gap:8px;flex-shrink:0}

.ed-main{max-width:1240px;margin:0 auto;padding:28px 24px 120px;display:flex;gap:28px;align-items:flex-start}
.ed-canvas{flex:1 1 480px;min-width:0}
.ed-panel{flex:0 0 340px;width:340px;position:sticky;top:84px;max-height:calc(100vh - 100px);overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:2px 2px 90px}
.ed-preview-note{max-width:800px;margin:0 auto 14px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);line-height:1.4}
.ed-preview-note>span:first-child{width:7px;height:7px;border-radius:50%;background:var(--ink);flex-shrink:0}

.ed-paper{--pad-x:clamp(24px,6vw,72px);--doc-accent:var(--ink);max-width:800px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:6px;padding:clamp(28px,6vw,64px) var(--pad-x) 56px;box-shadow:0 24px 60px -40px rgba(14,17,22,.28);color:var(--ink);font-size:16px}
.ed-block{position:relative;margin:0 -20px;padding:18px 20px;border-radius:10px;transition:background-color .12s;cursor:pointer;outline:none}
.ed-block:hover{background:#fafbfc}
.ed-block.selected{box-shadow:0 0 0 1.5px var(--ink)}
.ed-block:focus-visible{box-shadow:0 0 0 2px var(--ink)}
.is-owner .ed-block{cursor:text}
.ed-toolbar{position:absolute;top:-15px;right:14px;z-index:2;height:30px;padding:0 4px 0 12px;border:1px solid var(--ink);border-radius:999px;background:#fff;display:flex;align-items:center;gap:2px;color:var(--ink);cursor:default;animation:shFade .14s ease-out}
.ed-toolbar-label{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-right:6px}
.ed-toolbar button{height:24px;border:0;border-radius:6px;background:none;display:inline-flex;align-items:center;gap:6px;padding:0 8px;color:var(--ink);font-size:12px;font-weight:600}
.ed-toolbar button:hover{background:var(--hover)}
.ed-toolbar .sep{width:1px;height:14px;background:var(--line);margin:0 2px}

.ed-cover-body{display:flex;flex-direction:column;padding:8px 0 4px}
.ed-cover-eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--doc-accent)}
.ed-cover-title{margin:12px 0 0;font-size:44px;font-weight:700;letter-spacing:-.04em;line-height:1.1;text-wrap:balance}
.ed-cover-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px 20px;margin:32px 0 0;padding-top:18px;border-top:1px solid var(--line)}
.ed-cover-meta dt{font-size:12px;color:var(--muted);margin-bottom:3px}
.ed-cover-meta dd{margin:0;font-size:14px;font-weight:600}
.ed-parties{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:24px}
.ed-party{display:flex;flex-direction:column;gap:3px;font-size:14px;color:var(--muted)}
.ed-party .ed-mono{margin-bottom:8px}
.ed-party strong{font-size:16px;font-weight:700;color:var(--ink)}
.ed-heading{margin:0 0 10px;font-size:24px;font-weight:700;letter-spacing:-.03em;line-height:1.2}
.ed-prose{font-size:16px;line-height:1.65;color:var(--text);outline:none}
.ed-prose p{margin:0 0 12px;text-wrap:pretty}
.ed-prose>*:last-child{margin-bottom:0}
.ed-prose ul{padding-left:1.35em;margin:0}
.ed-prose li{margin:.25em 0}
.ed-prose li::marker{color:var(--doc-accent)}
.is-owner .ed-prose[contenteditable]:focus{background:transparent}
.ed-row{display:grid;grid-template-columns:minmax(0,1fr) 56px 52px 84px 104px;gap:4px;align-items:center;padding:8px 0;border-bottom:1px solid var(--inner);font-size:15px}
.ed-row>span{padding:0 6px;min-width:0}
.ed-row-head{padding:0 0 8px;border-bottom:1px solid var(--ink);font-size:12px;color:var(--muted)}
.ed-row .num{text-align:right;font-variant-numeric:tabular-nums}
.ed-row .muted{color:var(--muted)}
.ed-row strong{font-weight:600}
.ed-package-name{font-size:18px;font-weight:700;letter-spacing:-.02em}
.ed-package-desc{margin:2px 0 12px;font-size:14px;color:var(--muted)}
.ed-totals{width:min(100%,320px);margin:14px 0 0 auto;display:flex;flex-direction:column;gap:6px;font-size:14px;font-variant-numeric:tabular-nums}
.ed-totals div{display:flex;justify-content:space-between;gap:12px;color:var(--muted)}
.ed-totals .total{align-items:baseline;padding-top:10px;margin-top:4px;border-top:1px solid var(--ink);color:var(--ink)}
.ed-totals .total span{font-weight:700}
.ed-totals .total strong{font-size:22px;font-weight:700;letter-spacing:-.02em}
.ed-block.ed-signatures{margin:36px -20px 0;padding:24px 20px 18px;cursor:default}
.ed-block.ed-signatures:hover{background:none}
.ed-signatures::before{content:'';position:absolute;left:20px;right:20px;top:0;border-top:1px solid var(--line)}
.ed-sig-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.ed-sig-head>span:last-child{font-size:12px;color:var(--faint)}
.ed-signers{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:28px 32px}
.ed-sign-line{height:52px;border-bottom:1px solid var(--ink)}
.ed-signer strong{display:block;font-size:14px;font-weight:600;margin-top:8px}
.ed-signer span{display:block;font-size:13px;color:var(--muted)}

.ed-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.ed-card h2{font-size:15px;font-weight:700;line-height:1.3;display:flex;align-items:center;gap:8px}
.ed-card-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ed-card-head>span{font-size:12px;color:var(--muted)}
.ed-dot{width:8px;height:8px;border-radius:50%;background:var(--amber);flex-shrink:0}
.ed-dot.done{background:var(--green)}
.ed-card-text{margin:6px 0 0;font-size:14px;color:var(--muted);line-height:1.45}
.ed-avatar{width:28px;height:28px;border-radius:50%;background:var(--inner);display:grid;place-items:center;font-size:11px;font-weight:700;flex-shrink:0}
.ed-avatar.dark{background:var(--ink);color:#fff}
.ed-seg{display:flex;padding:3px;border-radius:9px;background:var(--inner)}
.ed-seg button{height:28px;padding:0 10px;border:0;border-radius:7px;background:transparent;font-size:12px;font-weight:600;white-space:nowrap;color:var(--ink)}
.ed-seg button[aria-checked=true]{background:#fff;box-shadow:0 1px 2px rgba(14,17,22,.12)}
.ed-input{width:100%;min-width:0;padding:9px 10px;border:1px solid var(--input);border-radius:8px;background:#fff;font-size:14px;line-height:1.45;outline:none;resize:vertical}
.ed-input:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(14,17,22,.08)}
.ed-input:focus-visible{outline:none}
.ed-check{display:flex;align-items:flex-start;gap:8px;font-size:13px;line-height:1.45;cursor:pointer}
.ed-check input{width:16px;height:16px;margin:1px 0 0;accent-color:var(--ink);flex-shrink:0}
.ed-error{margin:0;font-size:13px;color:var(--red)}

.ed-dialog{width:calc(100% - 32px);max-width:480px;max-height:calc(100dvh - 40px);overflow:auto;border:0;background:#fff;color:var(--text);border-radius:18px;padding:24px;box-shadow:0 30px 80px -30px rgba(14,17,22,.5);animation:shRise .22s var(--ease)}
.ed-dialog::backdrop{background:rgba(14,17,22,.36)}
.ed-dialog form{display:flex;flex-direction:column;gap:18px}
.ed-dialog h2{font-size:22px;font-weight:700;letter-spacing:-.02em;color:var(--ink);margin-bottom:4px}
.ed-dialog-sub{font-size:14px;color:var(--muted)}
.ed-send-list{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:6px 0 0;padding:0;list-style:none}
.ed-send-list>li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--inner)}
.ed-send-list>li:last-child{border-bottom:0}
.ed-send-list strong{display:block;font-size:14px;font-weight:600;color:var(--ink)}
.ed-send-list span:not(.ed-avatar){display:block;font-size:13px;color:var(--muted)}
.ed-dialog-note{font-size:13px;color:var(--muted);line-height:1.45}
.ed-dialog-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.ed-dialog .ed-btn.large{height:44px;padding:0 16px;border-radius:10px}

.ed-toast-wrap{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:80}
.ed-toast{display:flex;align-items:center;gap:12px;height:44px;padding:0 16px;border-radius:12px;background:var(--ink);color:#fff;font-size:14px;white-space:nowrap;box-shadow:0 16px 40px -16px rgba(14,17,22,.5);animation:shRise .2s var(--ease)}

/* Signing dialog: web/styles.css .signature-modal, unchanged */
.signature-modal{width:calc(100% - 24px);max-width:560px;max-height:calc(100dvh - 24px);overflow:auto;background:#fff;border:0;border-radius:20px;padding:22px;margin:auto auto 12px;color:var(--ink);box-shadow:0 12px 60px #0e111626;animation:shIn .25s ease}
.signature-modal::backdrop{background:#0e111680}
.signature-modal form{display:flex;flex-direction:column;gap:18px}
.signature-modal h2{font-size:22px;font-weight:700;letter-spacing:-.02em}
.field>span{display:block;font-size:13px;font-weight:600;margin:0 0 6px}
.field input{width:100%;height:46px;padding:0 14px;border:1px solid var(--input);border-radius:10px;background:#fff;font-size:15px;outline:none}
.field input:focus{border-color:var(--ink);box-shadow:0 0 0 3px #0e111614}
.draw-label{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px;font-size:13px;font-weight:600}
.draw-area{position:relative}
.draw-area canvas{display:block;width:100%;height:190px;background:#f8f9fa;border:1px solid var(--input);border-radius:12px;touch-action:none;cursor:crosshair}
.signature-baseline{position:absolute;left:22px;right:22px;bottom:46px;border-bottom:1px solid #c9ced4;pointer-events:none}
.signature-cross{position:absolute;left:22px;bottom:52px;font-size:18px;color:var(--faint);pointer-events:none}
.draw-placeholder{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;color:var(--subtle);pointer-events:none;padding-bottom:40px}
.sign-submit{width:100%;height:52px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-size:16px;font-weight:700}
.sign-submit:disabled{background:#b5bbc3;opacity:1}
.text-button{border:0;background:none;color:var(--muted);font-size:14px;font-weight:500;padding:0}
.text-button:hover{color:var(--ink)}
.underlined{text-decoration:underline;text-underline-offset:3px}

/* =================== New: rd-* (recipient document) =================== */

/* Brand lockup for the sender's team (web/styles.css .brand-lockup) */
.rd-brand{display:flex;align-items:center;gap:10px;min-width:0;flex-shrink:0}
.rd-brand-mark{width:28px;height:28px;border-radius:7px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:700}
.rd-brand-text{display:flex;flex-direction:column;gap:1px}
.rd-brand-text strong{font-size:15px;font-weight:700;letter-spacing:-.02em;line-height:1.1;white-space:nowrap}
.rd-brand-text small{font-size:10.5px;font-weight:500;color:var(--subtle);line-height:1.1}

/* Stage pill: the only place the state lives in the top bar */
.rd-pill{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 11px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:12.5px;font-weight:600;white-space:nowrap;flex-shrink:0}
.rd-pill .ed-dot{width:7px;height:7px}
.rd-who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);white-space:nowrap}

/* Bar directly above the document: what is shown, which version, which rendering */
.rd-stagebar{max-width:800px;margin:0 auto 12px;display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap}
.rd-stagebar-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.rd-version{height:30px;border:1px solid var(--input);border-radius:7px;padding:0 6px;background:#fff;font-size:12px;font-weight:600;cursor:pointer}
.rd-version:focus{outline:none;border-color:var(--ink)}

/* Section comment markers: sit on the block edge where the editor's block toolbar sits */
.rd-marker{position:absolute;top:-13px;right:14px;z-index:1;height:26px;min-width:26px;padding:0 9px 0 8px;border-radius:999px;border:1px solid var(--input);background:#fff;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.rd-marker:hover{border-color:var(--ink);color:var(--ink)}
.rd-marker.open{background:var(--ink);border-color:var(--ink);color:#fff}
.rd-marker.add{opacity:0;font-weight:600;transition:opacity .12s}
.ed-block:hover>.rd-marker.add,.rd-marker.add:focus-visible{opacity:1}
.ed-block.selected>.rd-marker{display:none}
@media (hover:none){.rd-marker.add{display:none}}
.rd-changed{display:inline-flex;align-items:center;gap:6px;margin-bottom:10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--subtle)}
.rd-changed i{width:6px;height:6px;border-radius:50%;background:var(--amber)}
.ed-block.flash{animation:rdFlash 1.2s var(--ease)}
@keyframes rdFlash{0%,40%{box-shadow:0 0 0 2px var(--ink)}100%{box-shadow:0 0 0 0 transparent}}

/* Inline state cards that sit above the document without replacing it */
.rd-callout{max-width:800px;margin:0 auto 14px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:flex;gap:14px;align-items:flex-start;animation:shIn .24s var(--ease)}
.rd-callout h2{font-size:17px;font-weight:700;letter-spacing:-.01em;margin-bottom:4px}
.rd-callout p{font-size:14px;line-height:1.5;color:var(--secondary)}
.rd-callout .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.rd-callout-icon{width:36px;height:36px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;flex-shrink:0}
.rd-callout.done{background:oklch(.97 .03 155);border-color:oklch(.9 .05 155)}
.rd-callout.done .rd-callout-icon{background:var(--green)}
.rd-callout.warn .rd-callout-icon{background:var(--amber);color:var(--ink)}
.rd-callout .grow{flex:1;min-width:0}
.rd-sent{font-size:13px!important;color:var(--muted)!important;margin-top:8px}

/* Mobile-only compact status line (the panel's status card on desktop) */
.rd-mstatus{display:none}

/* Steps: same pattern as web/styles.css .steps */

.rd-step.done>span{background:var(--inner);border-color:var(--inner);color:var(--ink)}

.rd-step.active>span{background:var(--ink);border-color:var(--ink);color:#fff}

.rd-filter{display:flex;align-items:center;gap:6px;margin:12px 0 0;flex-wrap:wrap}
.rd-chip{height:28px;padding:0 6px 0 10px;border:1px solid var(--line);border-radius:999px;background:var(--page);display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600}

.rd-composer{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.rd-composer textarea{min-height:76px}
.rd-composer-foot{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rd-composer-foot span{font-size:12px;color:var(--subtle);min-width:0}
.rd-threads{display:flex;flex-direction:column;margin:14px -10px 0}
.rd-thread{padding:12px 10px;border-top:1px solid var(--inner);border-radius:0;transition:background-color .12s}
.rd-thread.focus{background:var(--page);border-radius:12px;border-top-color:transparent}
.rd-thread.focus+.rd-thread{border-top-color:transparent}
.rd-thread-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.rd-anchor{border:0;background:none;padding:0;font-size:12px;font-weight:700;color:var(--ink);text-align:left;display:inline-flex;align-items:center;gap:5px}

.rd-comment{display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px 10px;margin-top:10px}
.rd-comment:first-of-type{margin-top:0}

.rd-comment p{grid-column:2;font-size:14px;line-height:1.5;color:var(--text);white-space:pre-wrap;overflow-wrap:anywhere}

.rd-thread-actions{display:flex;gap:2px;margin:8px 0 0 30px;flex-wrap:wrap}
.rd-reply{margin:8px 0 0 38px}

.rd-older{margin-top:12px;border-top:1px solid var(--inner);padding-top:10px}

/* Facts list for PDF/receipt cards */
.rd-facts{margin:12px 0 0;display:flex;flex-direction:column;gap:8px;font-size:13px}

.rd-events{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-direction:column}
.rd-events li{display:grid;grid-template-columns:12px minmax(0,1fr);gap:10px;font-size:13px;line-height:1.4;padding-bottom:10px;position:relative}
.rd-events li::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--ink);margin-top:5px}
.rd-events li::after{content:'';position:absolute;left:3px;top:15px;bottom:0;width:1px;background:var(--line)}
.rd-events li:last-child::after{display:none}
.rd-events time{display:block;font-family:var(--mono);font-size:11px;color:var(--subtle)}

.rd-pdf-in .small{font-size:1.45cqw;color:#5b626d}
.rd-pdf-in ul{margin:0;padding-left:3cqw}
.rd-pdf-in li{margin:.6cqw 0}
.rd-pdf-in table{width:100%;border-collapse:collapse;font-size:1.55cqw;margin-top:1cqw}
.rd-pdf-in th{font-weight:400;color:#6b727d;text-align:left;padding:0 0 1cqw;border-bottom:.15cqw solid #0e1116}
.rd-pdf-in td{padding:1.1cqw 0;border-bottom:.12cqw solid #e6e8eb}
.rd-pdf-in .r{text-align:right}
.rd-pdf-in .totals{width:46%;margin:2cqw 0 0 auto}
.rd-pdf-in .totals div{display:flex;justify-content:space-between;padding:.4cqw 0;color:#5b626d}
.rd-pdf-in .totals .t{border-top:.15cqw solid #0e1116;margin-top:.6cqw;padding-top:1.2cqw;color:#0e1116;font-size:2.3cqw;font-weight:700}
.rd-pdf-in .foot{position:absolute;left:9.4cqw;right:9.4cqw;bottom:5cqw;display:flex;justify-content:space-between;font-size:1.3cqw;color:#9aa1ab}
.rd-pdf-anchor{border-radius:.6cqw;outline:2px solid transparent;outline-offset:1cqw;transition:outline-color .2s}
.rd-pdf-anchor.focus{outline-color:var(--ink)}
.rd-pdf-anchor.diff{background:oklch(.97 .04 80);box-shadow:0 0 0 1cqw oklch(.97 .04 80)}
/* Signatures: shown under the PDF exactly as web/sign.tsx .sign-signatures does today */
.rd-sigsheet{background:#fff;border-radius:4px;box-shadow:0 1px 2px #0e11160f,0 10px 30px -18px #0e111640;padding:32px 9%;margin-top:8px}
.rd-sigsheet-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.rd-sigsheet-head .ed-mono{color:var(--ink);font-weight:500}
.rd-sigsheet-head span:last-child{font-size:12px;color:var(--muted)}

.rd-sigline{height:64px;border-bottom:1px solid var(--faint);display:flex;align-items:flex-end;padding-bottom:4px}

.rd-sigsheet strong{display:block;font-size:13px;font-weight:600;margin-top:8px}

.rd-zoom-hint{display:none}
.rd-zoom{width:100%;max-width:none;height:100dvh;max-height:none;margin:0;padding:0;border:0;background:#eceef1;color:var(--ink);display:none;flex-direction:column}

.rd-fingerprint p{margin-top:8px;font-family:var(--mono);font-size:11.5px;overflow-wrap:anywhere;line-height:1.6}

/* Bottom action bar: web/styles.css .sign-footer, also used for comments on mobile */
.rd-bar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.rd-bar-in{max-width:1240px;margin:0 auto;padding:0 8px;display:flex;align-items:center;gap:12px}
.rd-bar-text{flex:1;min-width:0}
.rd-bar-text strong{display:block;font-size:14px}

.rd-bar.review-only{display:none}

/* Comment sheet (mobile): a native modal <dialog> anchored to the bottom */
.rd-sheet{width:100%;max-width:none;max-height:86dvh;margin:auto 0 0;padding:0;border:0;border-radius:20px 20px 0 0;background:#fff;color:var(--ink);box-shadow:0 -20px 60px -20px rgba(14,17,22,.4);animation:shSheet .26s var(--ease);display:none;flex-direction:column}

.rd-sheet-head h2{flex:1;font-size:17px;font-weight:700;margin-top:8px}

.rd-sheet-body .ed-card{border:0;padding:12px 0 0;border-radius:0}

.rd-x{width:34px;height:34px;border:0;border-radius:8px;background:none;display:grid;place-items:center;color:var(--muted);padding:0}
.rd-x:hover{background:var(--hover);color:var(--ink)}

<script>
/* ---------- Icons (lucide geometry, 2px stroke, as in the app) ---------- */
const I = (d, s = 14) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const PEOPLE = { anna: { name: 'Anna Lindqvist', short: 'AL', role: 'VD, Bageri Lindqvist AB', email: 'anna@bagerilindqvist.se' }, johan: { name: 'Johan Ekström', short: 'JE', role: 'Projektledare, Norrsken Digital AB', email: 'johan@norrskendigital.se' } };

const HASH = '3f9a61c0e2b47d18a95c0b7e44f1d2c6b8e03a7795f1c4de28b6a0f91c37e5d2';

function content(v) {
  const q = v === 3 || v === 'x';

  const lines = [
    { name: 'Workshop och konceptarbete', sub: 'Halvdag i Umeå, inklusive dokumentation', qty: 1, unit: 'st', price: 18000 },
    { name: 'Design och utveckling', sub: 'Webbplats, beställningsfunktion och Swish Handel', qty: 1, unit: 'st', price: 96000 },

function pill() {
  const map = {
    review: ['', 'Utkast för granskning', 'Utkast'],
    handoff: ['', 'Klar för signering', 'Signering'],
    sign: ['', 'Väntar på din signatur', 'Att signera'],
    signed: ['done', S.variant === 'all' ? 'Signerat av alla' : 'Du har signerat', 'Signerat'],
  };
  if (S.who === 'owner') { map.review = ['', `Version ${S.shared} delad`, `v${S.shared} delad`]; map.handoff = ['', 'Skickat för signering', 'Skickat']; }
  const [cls, long, short] = map[S.stage] ?? map.review;
  return `<span class="rd-pill"><span class="ed-dot ${cls}" aria-hidden="true"></span><span class="long">${long}</span><span class="short">${short}</span></span>`;
}

function topbar() {
  if (S.who === 'owner') {

function commentCTA(id) {

  }
  if (S.stage === 'sign' && S.variant === 'changed' && !S.ref) return `<div class="rd-callout warn"><span class="rd-callout-icon">!</span><div class="grow"><h2>Ändrat efter version 3</h2><p>PDF:en innehåller en ändring i <strong>3. Pris</strong> som inte fanns i versionen du granskade: förvaltningen är 7 500 kr per kvartal i stället för 7 200 kr.</p>
    <div class="actions"><button type="button" class="ed-btn" data-act="jump" data-block="pris">Visa på sida 2</button></div></div></div>`;
  if (S.stage === 'signed') {

    return `<div class="rd-callout done" role="status"><span class="rd-callout-icon">${ic.check(18)}</span><div class="grow"><h2>${all ? 'Avtalet är signerat av alla' : 'Du har signerat'}</h2>
      <p>${all ? 'Johan Ekström signerade 16 okt 14:31. Den förseglade PDF:en kan laddas ner.' : 'Signerat 16 okt 2026, 14:02. Väntar på Johan Ekström. Du kan alltid komma tillbaka hit via samma länk.'}</p>
      <div class="actions">${all ? `<button type="button" class="ed-btn primary large" data-act="toast" data-msg="Laddar ner signerad PDF">${ic.down(15)}Ladda ner signerad PDF</button>` : `<button type="button" class="ed-btn large" data-act="toast" data-msg="Laddar ner PDF:en du signerade">${ic.down(15)}Ladda ner PDF:en du signerade</button>`}</div></div></div>`;
  }
  return '';
}

/* Discussion card: used in the desktop panel and inside the mobile sheet */
function discussion(inSheet) {

function thread(t) {

  const pdf = isPdf();
  const focus = S.selected && S.selected === t.block;
  const anchor = t.block ? `<button type="button" class="rd-anchor" data-act="jump" data-block="${t.block}" data-v="${t.v}">${anchorLabel(t.block)}${pdf ? ` <span class="pg">· sida ${PAGE_OF[t.block]}</span>` : ''}${t.v !== viewed() || (S.stage !== 'review' && S.who === 'client') ? ` <span class="pg">· v${t.v}</span>` : ''}</button>` : `<span class="rd-anchor" style="cursor:default">Hela dokumentet${t.v !== viewed() || S.stage !== 'review' ? ` <span class="pg">· v${t.v}</span>` : ''}</span>`;
  const state = t.resolved ? `<span class="rd-state resolved">${ic.check(12)}Löst</span>` : '<span class="rd-state">Öppen</span>';
  const replyable = !t.resolved && t.v === viewed() && S.stage === 'review';
  const key = `reply:${t.id}`;
  const actions = (replyable || (owner && S.stage === 'review')) ? `<div class="rd-thread-actions">${replyable && S.reply !== t.id ? `<button type="button" class="ed-text-btn" data-act="reply" data-id="${t.id}">Svara</button>` : ''}${owner && S.stage === 'review' ? `<button type="button" class="ed-text-btn" data-act="resolve" data-id="${t.id}">${t.resolved ? 'Öppna igen' : 'Markera som löst'}</button>` : ''}</div>` : '';
  const reply = S.reply === t.id ? `<form class="rd-composer rd-reply" data-act="post" data-key="${key}"><label class="visually-hidden" for="r-${t.id}">Svara</label><textarea id="r-${t.id}" class="ed-input" rows="2" placeholder="Svara…" data-key="${key}" data-focus-key="${key}">${esc(S.drafts[key] ?? '')}</textarea><div class="rd-composer-foot"><button type="button" class="ed-text-btn" data-act="reply" data-id="">Avbryt</button><button class="ed-btn primary" data-send="${key}" ${(S.drafts[key] ?? '').trim() ? '' : 'disabled'}>Svara</button></div></form>` : '';
  return `<article class="rd-thread${t.resolved ? ' resolved' : ''}${focus ? ' focus' : ''}" aria-label="Tråd om ${anchorLabel(t.block)}"><div class="rd-thread-head">${anchor}${state}</div>

    ${actions}${reply}</article>`;
}

  if (S.stage === 'handoff') return `<div class="rd-bar review-only"><div class="rd-bar-in">${comments}</div></div>`;
  if (S.stage === 'sign') return `<div class="rd-bar"><div class="rd-bar-in"><div class="rd-bar-text hide-m"><strong>Anna Lindqvist</strong><span>PDF, 3 sidor · fingeravtryck kontrollerat</span></div>${comments}<span style="flex:0 0 0"></span><button type="button" class="ed-btn primary xl" data-act="open-sign" style="margin-left:auto">${ic.pen(16)}${S.ref ? 'Visa PDF och signera' : 'Signera'}</button></div></div>`;
  return `<div class="rd-bar"><div class="rd-bar-in"><div class="rd-bar-text hide-m"><strong>${S.variant === 'all' ? 'Signerat av alla parter' : 'Du har signerat'}</strong><span>${S.variant === 'all' ? 'Förseglad PDF klar' : 'Väntar på Johan Ekström'}</span></div>${comments}<button type="button" class="ed-btn large" data-act="toast" data-msg="Laddar ner PDF" style="margin-left:auto">${ic.down(15)}${S.variant === 'all' ? 'Signerad PDF' : 'Ladda ner PDF'}</button></div></div>`;

/* Signatures from strokes, as web/ui.tsx <Signature> does */
const JOHAN = [[[60, 120], [80, 70], [95, 128], [110, 80], [130, 118], [160, 92], [200, 104], [250, 90], [300, 100]], [[90, 140], [280, 132]]];
function sigSVG(strokes) {
  if (!strokes) return '';
  return `<svg viewBox="0 0 500 190" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><g fill="none" stroke="#0e1116" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">${strokes.map(s => `<polyline points="${s.map(p => p.join(',')).join(' ')}"/>`).join('')}</g></svg>`;
}

/* ---------- Render ---------- */
function render() {
  const app = document.getElementById('app');
  const sY = window.scrollY;
  const v = viewed();
  app.className = S.who === 'owner' ? 'is-owner' : '';
  const canvas = isPdf() ? pdfStage() : paper(v);
  app.innerHTML = `${topbar()}<div class="ed-main"><main class="ed-canvas" aria-label="Dokument">${mobileStatus()}${callouts()}${stagebar()}${canvas}</main>
    <aside class="ed-panel" aria-label="${S.stage === 'sign' || S.stage === 'signed' ? 'Signering och diskussion' : 'Granskning och kommentarer'}">${statusCard()}${pdfCard()}${discussion(false)}</aside></div>${bar()}`;
  window.scrollTo(0, sY);
  const sheet = document.getElementById('sheet');
  if (sheet.open) sheet.innerHTML = sheetHTML();
  restoreFocus();
  syncProto();
}
function sheetHTML() {
  const sign = S.stage === 'sign' || S.stage === 'signed';
  return `<div class="rd-sheet-head"><h2 id="sheet-title">${sign ? 'Diskussion' : 'Kommentarer'} <span style="font-weight:500;color:var(--muted);font-size:14px">· ${S.who === 'client' && sign ? 'version 1–3' : `version ${viewed()}`}</span></h2><button type="button" class="rd-x" data-act="close-sheet" aria-label="Stäng">${ic.x(18)}</button></div>
    <div class="rd-sheet-body">${discussion(true)}</div>`;
}
function restoreFocus() {
  if (!S.focusKey) return;
  // Only a visible field: the panel is hidden on mobile, where the sheet takes over.
  const el = [...document.querySelectorAll(`[data-focus-key="${S.focusKey}"],[data-focus-key="${S.focusKey}:s"]`)].find(e => e.getClientRects().length);
  if (!el) return;
  el.focus({ preventScroll: !mobile() }); el.setSelectionRange?.(el.value.length, el.value.length); if (!mobile()) el.scrollIntoView({ block: 'nearest' });
  S.focusKey = null;
}
function openSheet() { const sheet = document.getElementById('sheet'); sheet.innerHTML = sheetHTML(); if (!sheet.open) sheet.showModal(); restoreFocus(); S.focusKey = null; }
function closeSheet() { const sheet = document.getElementById('sheet'); if (sheet.open) sheet.close(); }
/* Mobile: an A4 canvas at phone width is too small to read, so a page opens in a pannable, pinch-zoomable viewer. */
function openZoom(page) {
  const d = document.getElementById('zoom');
  d.innerHTML = `<div class="rd-sheet-head" style="border-radius:0"><h2 id="zoom-title">Sida ${page.dataset.page} av 3</h2><button type="button" class="rd-x" data-act="close-zoom" aria-label="Stäng">${ic.x(18)}</button></div><div class="rd-zoom-body">${page.outerHTML.replace('data-act="zoom"', '')}</div>`;
  d.showModal();
}
let toastTimer;
function toast(msg) { const w = document.getElementById('toast'); w.firstElementChild.textContent = msg; w.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { w.hidden = true; }, 2600); }

function scrollToBlock(id) {
  requestAnimationFrame(() => {
    const el = isPdf() ? document.querySelector(`[data-pdf-anchor="${id}"]`) : document.querySelector(`.ed-block[data-block="${id}"]`);
    if (!el) return;
    const top = el.getBoundingClientRect().top + window.scrollY - (mobile() ? 80 : 110);
    window.scrollTo({ top, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    if (!isPdf()) { el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
  });
}

/* ---------- Actions ---------- */
function act(name, el, event) {
  const id = el.dataset.block ?? null;
  switch (name) {
    case 'select':
      if (event.target.closest('button,[contenteditable],a,select,textarea,input')) return;
      if (S.selected === id) return;
      S.selected = id; S.filter = id; render(); return;
    case 'comment':
      S.selected = id; S.filter = id;
      // Existing threads open for reading; an empty section or the explicit Kommentera starts typing.
      if (canComment() && (el.dataset.compose || !visibleThreads().some(t => t.block === id))) S.focusKey = `new:${id}`;
      render(); if (mobile()) openSheet(); return;
    case 'compose-general': S.selected = null; S.filter = null; S.focusKey = 'new:null'; render(); openSheet(); return;
    case 'clear-filter': S.filter = null; S.selected = null; render(); return;
    case 'sheet': S.filter = S.selected ?? null; openSheet(); return;
    case 'close-sheet': closeSheet(); return;
    case 'jump': {
      const v = Number(el.dataset.v);
      if (S.stage === 'review' && v && v !== viewed()) S.view = v === latest() ? null : v;
      S.selected = id; S.filter = S.filter === null ? null : id; S.pdfFocus = isPdf() ? id : null;
      closeSheet(); render(); scrollToBlock(id);
      if (isPdf()) setTimeout(() => { S.pdfFocus = null; document.querySelectorAll('.rd-pdf-anchor.focus').forEach(a => a.classList.remove('focus')); }, 2200);
      return;
    }
    case 'reply': S.reply = el.dataset.id || null; if (S.reply) S.focusKey = `reply:${S.reply}`; render(); if (document.getElementById('sheet').open) openSheet(); return;
    case 'resolve': { const t = S.threads.find(t => t.id === el.dataset.id); t.resolved = !t.resolved; render(); toast(t.resolved ? 'Tråden är markerad som löst' : 'Tråden är öppen igen'); return; }
    case 'version-latest': S.view = null; render(); return;
    case 'ref': S.ref = el.dataset.ref === '1'; S.selected = null; render(); return;
    case 'share': S.shared += 1; S.view = null; render(); toast(`Version ${S.shared} är delad med Anna`); return;
    case 'handoff': S.handoffSent = true; render(); return;
    case 'open-send': openSend(); return;
    case 'open-sign':
      if (S.ref) { S.ref = false; render(); window.scrollTo({ top: 0 }); toast('Läs PDF:en och signera'); return; }
      openSign(); return;
    case 'toast': toast(el.dataset.msg); return;
    case 'zoom': if (mobile()) openZoom(el); return;
    case 'close-zoom': document.getElementById('zoom').close(); return;
  }
}
function post(key) {
  const body = (S.drafts[key] ?? '').trim();
  if (!body) return;
  const who = S.who === 'owner' ? 'johan' : 'anna';
  const now = new Date().toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' });
  const comment = { who, at: `16 okt ${now}`, body };
  if (key.startsWith('reply:')) { S.threads.find(t => t.id === key.slice(6)).comments.push(comment); S.reply = null; }
  else { const block = key.slice(4) === 'null' ? null : key.slice(4); S.threads.push({ id: 't' + Date.now(), v: S.stage === 'review' ? viewed() : 3, block, resolved: false, comments: [comment] }); }
  S.drafts[key] = '';
  render(); if (document.getElementById('sheet').open) openSheet();
  toast(key.startsWith('reply:') ? 'Svaret är skickat' : 'Kommentaren är skickad');
}

document.addEventListener('click', event => {
  const el = event.target.closest('[data-act]');
  if (!el || el.tagName === 'FORM' || el.tagName === 'SELECT') return;
  act(el.dataset.act, el, event);
});
document.addEventListener('keydown', event => {
  const block = event.target.closest?.('.ed-block[data-act="select"]');
  if (block && event.target === block && (event.key === 'Enter' || event.key === ' ')) { event.preventDefault(); act('comment', block, event); }
  if (event.key === 'Escape' && S.selected && !document.querySelector('dialog[open]') && !event.target.closest('textarea,input,[contenteditable]')) { S.selected = null; S.filter = null; render(); }
});
document.addEventListener('input', event => {
  const key = event.target.dataset?.key; if (!key) return;
  S.drafts[key] = event.target.value;
  document.querySelectorAll(`[data-send="${CSS.escape(key)}"]`).forEach(b => { b.disabled = !event.target.value.trim(); });
  document.querySelectorAll(`textarea[data-key="${CSS.escape(key)}"]`).forEach(t => { if (t !== event.target) t.value = event.target.value; });
});
document.addEventListener('submit', event => { const form = event.target.closest('form[data-act="post"]'); if (!form) return; event.preventDefault(); post(form.dataset.key); });
document.addEventListener('change', event => {
  if (event.target.dataset?.act === 'version') { const n = Number(event.target.value); S.view = n === latest() ? null : n; S.selected = null; S.filter = null; render(); }
});
document.addEventListener('keydown', event => {
  if (event.key === 'Enter' && (event.metaKey || event.ctrlKey) && event.target.matches('textarea[data-key]')) { event.preventDefault(); post(event.target.dataset.key); }
});
document.getElementById('sheet').addEventListener('click', event => { if (event.target.id === 'sheet') closeSheet(); });

/* ---------- Owner: send for signing, mapping the review link to a signer ---------- */
function openSend() {
  const d = document.getElementById('send');

  d.innerHTML = `<form method="dialog"><div><h2 id="send-title">Skicka för signering</h2><p class="ed-dialog-sub">Uppdragsavtal – Bageri Lindqvist</p></div>
    <div><p class="ed-mono">Signerar</p><ul class="ed-send-list"><li><span class="ed-avatar" aria-hidden="true">AL</span><div><strong>Anna Lindqvist</strong><span>VD · anna@bagerilindqvist.se</span></div></li><li><span class="ed-avatar dark" aria-hidden="true">JE</span><div><strong>Johan Ekström (du)</strong><span>Du signerar i nästa steg</span></div></li></ul></div>
    <div><p class="ed-mono">Granskning</p><ul class="ed-send-list"><li><span class="ed-avatar" aria-hidden="true">${ic.link(13)}</span><div><strong>Annas granskningslänk</strong><span>Visar att avtalet väntar på signering. Den kan inte signera.</span></div></li></ul></div>
    <p class="ed-dialog-note">Signerarna ser granskningens diskussion bredvid PDF:en och kan ställa frågor där.</p>
    ${unshared ? `<label class="ed-check"><input type="checkbox" required>Jag vill skicka mitt nuvarande utkast, med ändringar i ${privateChanges().map(anchorLabel).join(' och ')} som Anna inte har granskat. Anna ser vad som ändrats.</label>` : `<p class="ed-dialog-note">PDF:en skapas från version ${S.shared}, samma innehåll som Anna har granskat.</p>`}
    <p class="ed-dialog-note">Inga e-postmeddelanden skickas. Du får en personlig signeringslänk per mottagare att dela. En signatursida läggs till sist.</p>
    <div class="ed-dialog-actions"><button type="button" class="ed-btn large" value="cancel" onclick="this.closest('dialog').close()">Avbryt</button><button class="ed-btn primary large" value="ok">Skicka och signera</button></div></form>`;
  d.showModal();
  d.querySelector('form').onsubmit = () => { setTimeout(() => { S.variant = unshared ? 'changed' : ''; S.stage = 'handoff'; S.shared = 3; S.view = null; S.selected = null; S.filter = null; render(); toast('Skickat för signering'); }, 0); };
}

/* ---------- Client: signing dialog, as web/sign.tsx SignatureModal ---------- */
let strokes = [];
function openSign() {
  const d = document.getElementById('signmodal');
  strokes = [];
  d.innerHTML = `<form><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><h2 id="sign-title">Signera</h2><button type="button" class="text-button" data-close>Avbryt</button></div>
    <p class="ed-dialog-note" style="margin-top:-8px">Du signerar <strong style="color:var(--ink)">Uppdragsavtal – ny webbplats och förvaltning</strong>, PDF med 3 sidor, fingeravtryck <span style="font-family:var(--mono);font-size:12px">${(S.variant === 'changed' ? HASH_X : HASH).slice(0, 12)}…</span></p>
    <label class="field"><span>Ditt fullständiga namn</span><input value="Anna Lindqvist" autocomplete="name" required></label>
    <div><div class="draw-label"><span>Rita din signatur</span><button type="button" class="text-button underlined" style="font-size:13px" data-clear>Rensa</button></div>
      <div class="draw-area"><canvas aria-label="Rita din signatur med mus eller finger" tabindex="0"></canvas><div class="signature-baseline"></div><span class="signature-cross">×</span><span class="draw-placeholder">Rita med mus eller finger</span></div></div>
    <label class="ed-check" style="font-size:14px"><input type="checkbox" data-consent>Jag har läst dokumentet och godkänner innehållet. Jag förstår att min elektroniska signatur är bindande.</label>
    <button class="sign-submit" disabled>Signera dokumentet</button>
    <p class="ed-dialog-note" style="text-align:center;font-size:12.5px">Tidpunkt, IP-adress och enhet sparas som bevis för din signatur.</p></form>`;
  d.showModal();
  const canvas = d.querySelector('canvas'), ctx = canvas.getContext('2d'), submit = d.querySelector('.sign-submit'), consent = d.querySelector('[data-consent]'), ph = d.querySelector('.draw-placeholder');
  const size = () => { const r = canvas.getBoundingClientRect(); canvas.width = r.width * 2; canvas.height = r.height * 2; paint(); };
  const paint = () => { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.setTransform(canvas.width / 500, 0, 0, canvas.height / 190, 0, 0); ctx.strokeStyle = '#0e1116'; ctx.lineWidth = 2.6 * 500 / canvas.getBoundingClientRect().width; ctx.lineCap = ctx.lineJoin = 'round'; strokes.forEach(s => { ctx.beginPath(); s.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke(); }); ph.style.display = strokes.length ? 'none' : ''; check(); };
  const check = () => { submit.disabled = !(consent.checked && strokes.some(s => s.length > 3)); };
  const pt = e => { const r = canvas.getBoundingClientRect(); return [Math.round((e.clientX - r.left) / r.width * 500), Math.round((e.clientY - r.top) / r.height * 190)]; };
  let drawing = false;
  canvas.onpointerdown = e => { drawing = true; canvas.setPointerCapture(e.pointerId); strokes.push([pt(e)]); e.preventDefault(); };
  canvas.onpointermove = e => { if (drawing) { strokes.at(-1).push(pt(e)); paint(); } };
  canvas.onpointerup = canvas.onpointercancel = () => { drawing = false; paint(); };
  consent.onchange = check;
  d.querySelector('[data-clear]').onclick = () => { strokes = []; paint(); };
  d.querySelector('[data-close]').onclick = () => d.close();
  d.__demo = () => { strokes = DEMO_SIG.map(s => s.map(p => [...p])); consent.checked = true; paint(); };
  d.querySelector('form').onsubmit = e => { e.preventDefault(); S.sig = strokes; S.stage = 'signed'; S.variant = 'waiting'; S.ref = false; d.close(); render(); window.scrollTo({ top: 0 }); };
  requestAnimationFrame(size);
}
const DEMO_SIG = [[[40, 128], [62, 64], [78, 132], [92, 92], [118, 96], [104, 132], [140, 106], [150, 70], [158, 128], [176, 104], [196, 126], [222, 98], [238, 124], [262, 96], [292, 116], [330, 104], [380, 110]], [[70, 150], [360, 140]]];

/* ---------- Prototype controls ---------- */
const VARIANTS = {
  review: [],
  handoff: [['', 'E-post konfigurerad'], ['noemail', 'Utan e-post (avsändaren delar länken)']],
  sign: [['', 'Samma innehåll som version 3'], ['changed', 'Ändrat efter granskning']],
  signed: [['waiting', 'Väntar på avsändaren'], ['all', 'Alla har signerat']],
};
function syncProto() {
  document.getElementById('p-who').value = S.who;
  document.getElementById('p-stage').value = S.stage;
  const opts = VARIANTS[S.stage];
  const wrap = document.getElementById('p-variant-wrap');
  wrap.hidden = !opts.length || S.who === 'owner';
  const sel = document.getElementById('p-variant');
  sel.innerHTML = opts.map(([k, l]) => `<option value="${k}"${k === S.variant ? ' selected' : ''}>${l}</option>`).join('');
  const hash = `#${S.who}/${S.stage}${S.variant ? '/' + S.variant : ''}`;
  if (location.hash !== hash) history.replaceState(null, '', hash);
}
function setStage(stage, variant) {
  S.stage = stage; S.variant = variant ?? (VARIANTS[stage][0]?.[0] ?? '');
  S.view = null; S.selected = null; S.filter = null; S.ref = false; S.reply = null; S.pdfFocus = null;
  if (stage !== 'review') S.shared = 3;
  if (stage === 'signed' && !S.sig) S.sig = DEMO_SIG;
  closeSheet(); render(); window.scrollTo(0, 0);
}
document.getElementById('p-who').onchange = e => { S.who = e.target.value; if (S.who === 'owner' && (S.stage === 'sign' || S.stage === 'signed')) S.stage = 'handoff'; setStage(S.stage, S.variant); };
document.getElementById('p-stage').onchange = e => { if (S.who === 'owner' && (e.target.value === 'sign' || e.target.value === 'signed')) S.who = 'client'; setStage(e.target.value); };
document.getElementById('p-variant').onchange = e => setStage(S.stage, e.target.value);
document.getElementById('p-reset').onclick = () => { S = fresh(); closeSheet(); render(); window.scrollTo(0, 0); };
window.addEventListener('resize', () => { if (!mobile()) closeSheet(); });

/* Deep links for review and screenshots: #client/sign/changed, #owner/review … */
(function boot() {
  const [who, stage, variant] = location.hash.slice(1).split('/');
  if (who === 'owner' || who === 'client') S.who = who;
  if (VARIANTS[stage]) { S.stage = stage; S.variant = variant ?? (VARIANTS[stage][0]?.[0] ?? ''); if (stage !== 'review') S.shared = 3; if (stage === 'signed') S.sig = DEMO_SIG; }
  render();
})();
window.proto = { get state() { return S; }, render, openSheet, act: (name, data = {}) => { const el = document.createElement('button'); Object.assign(el.dataset, data); act(name, el, { target: document.body }); }, demoSign: () => document.getElementById('signmodal').__demo?.() };
</script>
</body>
