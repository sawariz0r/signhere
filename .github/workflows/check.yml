name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: signhere
          POSTGRES_PASSWORD: signhere-test-only
          POSTGRES_DB: signhere_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U signhere -d signhere_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://signhere:signhere-test-only@localhost:5432/signhere_test
      SIGNHERE_SEAL_PYTHON: ${{ github.workspace }}/.local/seal-python/bin/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/pdf-seal/requirements.txt
      - run: python -m venv .local/seal-python
      - run: .local/seal-python/bin/pip install --require-hashes -r scripts/pdf-seal/requirements.txt
      - run: npm ci
      - run: node scripts/test-deployment-db.mjs
      - run: .local/seal-python/bin/python -I -B scripts/pdf-seal/test_engine.py
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
  docker-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SIGNHERE_RUN_DOCKER_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: docker compose version
      - name: Host kernel and Landlock support
        run: uname -r && cat /sys/kernel/security/lsm && echo
      - name: Fresh setup, sealing, restart, restricted SQL role, and paired restore
        run: node scripts/test-docker.mjs
